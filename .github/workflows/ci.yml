name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff pytest numpy opencv-python-headless
      - name: Lint
        run: ruff check ml
      - name: Tests
        run: pytest ml/tests -q
