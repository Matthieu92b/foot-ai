# Agent Planner — transforme une idée brute (label "idée") en ticket planifié
name: Claude Planner
on:
  issues:
    types: [labeled]

concurrency:
  group: planner-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  plan:
    if: >
      github.event.label.name == 'idée' &&
      !contains(github.event.issue.labels.*.name, 'planifié')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 1. On récupère l'issue nous-mêmes et on la donne à Claude dans un fichier
      - name: Récupérer l'issue
        run: gh issue view "$ISSUE" --json title,body,labels > issue.json

      # 2. Claude lit et écrit uniquement des fichiers
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Tu es l'agent Planner du projet.
            Lis issue.json (l'idée brute), CLAUDE.md, AGENTS.md et docs/prompts/planner.md.
            Écris le plan dans le fichier plan.md, exactement au format de docs/prompts/planner.md.
            N'écris aucun autre fichier. Ne code rien.
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 10
            --allowedTools "Read,Write"

      # 3. Le workflow publie le plan (déterministe)
      - name: Publier le plan
        run: |
          if [ ! -s plan.md ]; then
            echo "plan.md absent ou vide"; exit 1
          fi
          gh issue comment "$ISSUE" --body-file plan.md
          gh issue edit "$ISSUE" --add-label "planifié"